site_name: Blackhole Docs
site_description: Documentazione bilingue per l'infrastruttura HPC Blackhole del CI-SSLab
site_url: https://ci-sslab.github.io/blackhole-docs/
repo_url: https://github.com/CI-SSLab/blackhole-docs
edit_uri: edit/main/docs/
copyright: CI-SSLab · Università degli Studi di Napoli Parthenope

theme:
  name: material
  language: it
  custom_dir: overrides
  logo: assets/parthenope-official-white.svg
  favicon: assets/parthenope-mark-official.svg
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan

extra_css:
  - stylesheets/extra-v3.css
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/CI-SSLab/blackhole-docs
      name: Repository GitHub

plugins:
  - search:
      lang: [it, en]
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      languages:
        - locale: it
          name: Italiano
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: Blackhole Docs
          site_description: Bilingual documentation for CI-SSLab's Blackhole HPC infrastructure
          nav_translations:
            Inizia: Getting started
            Primo accesso: First login
            Accesso: Access
            Ambiente: Environment
            Python con uv: Python with uv
            Partizioni: Partitions
            Esempi di job: Job examples

nav:
  - Home: index.md
  - Inizia:
      - Primo accesso: quickstart.md
  - Accesso:
      - SSH: access/ssh.md
  - Ambiente:
      - VS Code: environment/vscode.md
      - Python con uv: environment/uv.md
  - SLURM:
      - Partizioni: slurm/partitions.md
      - Esempi di job: slurm/jobs.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
